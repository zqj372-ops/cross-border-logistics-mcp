# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: FreightClaw MCP administrator access
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - id: freightclaw-admin-claims
    model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: FreightClaw MCP administrator claims
    attrs:
      name: FreightClaw MCP administrator claims
      scope_name: freightclaw_admin
      description: Fixed management-tenant claims for the administrator-only MCP console.
      expression: |
        return {
            "tenant_id": "tenant_management",
            "actor_role": "admin",
            "roles": ["admin"],
            "scopes": ["platform:admin", "tenant:admin"],
        }

  - id: freightclaw-admin-provider
    model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: freightclaw-admin-proxy
    attrs:
      name: freightclaw-admin-proxy
      mode: forward_single
      external_host: https://www.freightclaw.net/access-console/
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      certificate: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      refresh_token_validity: hours=1
      intercept_header_auth: false
      internal_host_ssl_validation: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !KeyOf freightclaw-admin-claims

  - id: freightclaw-admin-application
    model: authentik_core.application
    state: present
    identifiers:
      slug: freightclaw-admin
    attrs:
      name: FreightClaw MCP Admin
      slug: freightclaw-admin
      meta_launch_url: https://www.freightclaw.net/access-console/
      policy_engine_mode: all
      provider: !KeyOf freightclaw-admin-provider

  - id: freightclaw-admin-policy-binding
    model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf freightclaw-admin-application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]

  - id: freightclaw-embedded-outpost
    model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf freightclaw-admin-provider

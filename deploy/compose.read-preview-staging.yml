services:
  logistics-mcp-read-preview-staging:
    image: "${READ_PREVIEW_IMAGE:?READ_PREVIEW_IMAGE is required}"
    container_name: logistics-mcp-read-preview-staging
    command: ["node", "dist/src/logistics_mcp/server/start.mjs"]
    restart: "unless-stopped"
    expose:
      - "8080"
    environment:
      MCP_PORT: "8080"
      MCP_DATA_MODE: "production"
      MCP_RUNTIME_PROFILE: "read-preview-staging"
      MCP_TRANSPORT_MODE: "stateless"
      MCP_JWT_ISSUER: "${MCP_JWT_ISSUER:?MCP_JWT_ISSUER is required}"
      MCP_JWT_AUDIENCE: "${MCP_JWT_AUDIENCE:?MCP_JWT_AUDIENCE is required}"
      MCP_JWKS_URL: "${MCP_JWKS_URL:?MCP_JWKS_URL is required}"
      MCP_INSTANCE_ID: "${MCP_INSTANCE_ID:?MCP_INSTANCE_ID is required}"
      MCP_STATE_DB_PATH: "/var/lib/logistics-mcp/platform.sqlite"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:?MCP_ALLOWED_ORIGINS is required}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?MCP_ALLOWED_HOSTS is required}"
      MCP_ALLOWED_OUTBOUND_HOSTS: "${MCP_ALLOWED_OUTBOUND_HOSTS:?MCP_ALLOWED_OUTBOUND_HOSTS is required}"
      MCP_TRUSTED_PROXY_ADDRESSES: "${MCP_TRUSTED_PROXY_ADDRESSES:?MCP_TRUSTED_PROXY_ADDRESSES is required}"

      MCP_QUOTE_PREVIEW_ENABLED: "${MCP_QUOTE_PREVIEW_ENABLED:-false}"
      MCP_QUOTE_PREVIEW_BASE_URL: "${MCP_QUOTE_PREVIEW_BASE_URL:-}"
      MCP_QUOTE_PREVIEW_ALLOWED_HOSTS: "${MCP_QUOTE_PREVIEW_ALLOWED_HOSTS:-}"
      MCP_QUOTE_PREVIEW_API_KEY_SECRET_FILE: "/run/secrets/read-preview/quote-preview-api-key"
      MCP_QUOTE_PREVIEW_ORIGIN_MAP_FILE: "/run/config/quote-preview-origin-map.json"

      MCP_RISK_CUSTOMS_ENABLED: "${MCP_RISK_CUSTOMS_ENABLED:-false}"
      MCP_RISK_CUSTOMS_BASE_URL: "${MCP_RISK_CUSTOMS_BASE_URL:-}"
      MCP_RISK_CUSTOMS_ALLOWED_HOSTS: "${MCP_RISK_CUSTOMS_ALLOWED_HOSTS:-}"
      MCP_RISK_CUSTOMS_ALLOWED_TENANTS: "${MCP_RISK_CUSTOMS_ALLOWED_TENANTS:-}"
      MCP_RISK_CUSTOMS_AUTH_SECRET_FILE: "/run/secrets/read-preview/riskcustoms-m2m-token"

      MCP_FREIGHTCOM_TEST_ENABLED: "${MCP_FREIGHTCOM_TEST_ENABLED:-false}"
      MCP_FREIGHTCOM_TEST_AUTH_SECRET_FILE: "/run/secrets/read-preview/freightcom-test-auth"
      MCP_FREIGHTCOM_TEST_ALLOWED_TENANTS: "${MCP_FREIGHTCOM_TEST_ALLOWED_TENANTS:-}"
    volumes:
      - type: volume
        source: read_preview_state
        target: /var/lib/logistics-mcp
      - type: bind
        source: "${READ_PREVIEW_SECRET_DIR:?READ_PREVIEW_SECRET_DIR is required}"
        target: /run/secrets/read-preview
        read_only: true
      - type: bind
        source: "${QUOTE_PREVIEW_ORIGIN_MAP_FILE:?QUOTE_PREVIEW_ORIGIN_MAP_FILE is required}"
        target: /run/config/quote-preview-origin-map.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - freightclaw

volumes:
  read_preview_state:
    name: logistics-mcp-read-preview-staging-state

networks:
  freightclaw:
    external: true
    name: freightclaw-net

map $http_cf_connecting_ip $freightclaw_client_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

map $http_cf_access_jwt_assertion $freightclaw_admin_authorization {
    default "Bearer $http_cf_access_jwt_assertion";
    "" "";
}

map $http_cf_access_jwt_assertion $freightclaw_admin_edge_authenticated {
    default 1;
    "" 0;
}

limit_req_zone $freightclaw_client_key zone=freightclaw_mcp:10m rate=10r/s;
limit_req_zone $freightclaw_client_key zone=freightclaw_read_preview:10m rate=2r/s;
limit_req_zone $freightclaw_client_key zone=freightclaw_exchange:10m rate=10r/m;
limit_req_zone $freightclaw_client_key zone=freightclaw_admin:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name freightclaw.net www.freightclaw.net;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://www.freightclaw.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name freightclaw.net www.freightclaw.net;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FreightClawSSL:10m;
    ssl_session_timeout 1d;

    ssl_client_certificate /etc/nginx/certs/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location = /access/v1/token/exchange {
        limit_req zone=freightclaw_exchange burst=5 nodelay;
        proxy_pass http://logistics-mcp-access-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
    }

    location = /admin {
        if ($freightclaw_admin_edge_authenticated = 0) { return 401; }
        return 308 /access-console/;
    }

    location = /admin/ {
        if ($freightclaw_admin_edge_authenticated = 0) { return 401; }
        return 308 /access-console/;
    }

    location ^~ /admin/api/v1/access/ {
        if ($freightclaw_admin_edge_authenticated = 0) { return 401; }
        limit_req zone=freightclaw_admin burst=10 nodelay;
        proxy_pass http://logistics-mcp-access-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $freightclaw_admin_authorization;
        proxy_set_header Cookie "";
    }

    location = /.well-known/jwks.json {
        proxy_pass http://logistics-mcp-access-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
    }

    location = /access-console {
        if ($freightclaw_admin_edge_authenticated = 0) { return 401; }
        proxy_pass http://logistics-mcp-access-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
    }

    location ^~ /access-console/ {
        if ($freightclaw_admin_edge_authenticated = 0) { return 401; }
        proxy_pass http://logistics-mcp-access-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
    }

    location ^~ /access/ {
        proxy_pass http://logistics-mcp-access-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
    }

    location = /runtime/healthz {
        proxy_pass http://logistics-mcp-runtime:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /runtime/readyz {
        proxy_pass http://logistics-mcp-runtime:8080/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /mcp {
        limit_req zone=freightclaw_mcp burst=30 nodelay;
        proxy_pass http://logistics-mcp-runtime:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
    }

    location = /staging/runtime/healthz {
        proxy_pass http://logistics-mcp-read-preview-staging:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /staging/runtime/readyz {
        proxy_pass http://logistics-mcp-read-preview-staging:8080/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /staging/mcp {
        limit_req zone=freightclaw_read_preview burst=4 nodelay;
        proxy_pass http://logistics-mcp-read-preview-staging:8080/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}

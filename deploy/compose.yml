services:
  logistics-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cross-border-logistics-mcp:candidate
    restart: "no"
    expose:
      - "8080"
    environment:
      MCP_PORT: "8080"
      MCP_DATA_MODE: "${MCP_DATA_MODE:?MCP_DATA_MODE is required}"
      MCP_JWT_ISSUER: "${MCP_JWT_ISSUER:?MCP_JWT_ISSUER is required}"
      MCP_JWT_AUDIENCE: "${MCP_JWT_AUDIENCE:?MCP_JWT_AUDIENCE is required}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:?MCP_ALLOWED_ORIGINS is required}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?MCP_ALLOWED_HOSTS is required}"
      MCP_ALLOWED_OUTBOUND_HOSTS: "${MCP_ALLOWED_OUTBOUND_HOSTS:?MCP_ALLOWED_OUTBOUND_HOSTS is required}"
      MCP_TENANT_MAPPING: "${MCP_TENANT_MAPPING:?MCP_TENANT_MAPPING is required}"
      MCP_CLIENT_ID: "${MCP_CLIENT_ID:?MCP_CLIENT_ID is required}"
      MCP_UPSTREAM_TOKEN_FILE: "/run/secrets/mcp_upstream_token"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    secrets:
      - mcp_upstream_token

secrets:
  mcp_upstream_token:
    external: true

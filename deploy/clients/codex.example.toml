# 按 OpenAI 当前 Codex MCP 配置格式编写。使用前替换示例地址。
# 本机 helper 从安全存储读取长期 Key，仅向统一凭证网关兑换短期 JWT；
# Codex 在同源请求收到 401/403 后会重新执行 helper 并仅重试一次。
[mcp_servers.cross_border_logistics]
url = "https://mcp.example.invalid/mcp"
http_headers_helper = "freightclaw-auth-headers"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = [
  "cargo.calculate",
  "container.plan_summary",
  "system.agent_context.get",
]
# Read-only resources are discovered after initialize:
# logistics://agent/bootstrap
# logistics://standards/index
# logistics://contracts/envelope/current
# logistics://modules/catalog
# logistics://agent/profiles
# 当前仅为模板，待真实 staging 适配验证。

# 按 OpenAI 当前 Codex MCP 配置格式编写。使用前替换示例地址，
# 并由企业身份平台把短期令牌注入 LOGISTICS_MCP_BEARER_TOKEN。
[mcp_servers.cross_border_logistics]
url = "https://mcp.example.invalid/mcp"
bearer_token_env_var = "LOGISTICS_MCP_BEARER_TOKEN"
enabled = true
required = true
startup_timeout_sec = 20
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
enabled_tools = [
  "cargo.calculate",
  "container.plan_summary",
  "quote.canada_final_mile.calculate",
  "quote.save_draft",
  "customs.ca.search",
  "customs.ca.estimate",
  "knowledge.search_curated",
  "system.get_data_status",
  "review.create_task",
]

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="跨境物流 Agent 能力运营：安全调整内置能力，并用服务端读回证明生效。" />
    <title>跨境物流 Agent 能力运营</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app" data-state="loading">
      <header class="topbar">
        <a class="brand" href="#overview" aria-label="跨境物流 Agent 能力运营首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M6 7.5h20v5H6zM6 15h13v5H6zM6 22.5h20v2H6z" fill="currentColor" />
            </svg>
          </span>
          <span>
            <span class="brand-title">FreightClaw</span>
            <span class="brand-subtitle">能力运营</span>
          </span>
        </a>
        <div class="topbar-context" aria-label="当前上下文">
          <div class="context-item">
            <span class="context-label">租户</span>
            <strong id="tenant-name">未连接</strong>
          </div>
          <div class="context-item">
            <span class="context-label">环境</span>
            <span id="environment-badge" class="status-pill status-neutral">未连接</span>
          </div>
          <div class="context-item context-version">
            <span class="context-label">当前配置</span>
            <strong id="config-version">—</strong>
          </div>
          <div class="context-item actor-item">
            <span class="context-label">当前用户</span>
            <strong id="actor-name">—</strong>
            <span id="actor-role" class="muted">—</span>
          </div>
        </div>
      </header>

      <div class="app-layout">
        <aside class="sidebar" aria-label="控制台导航区域">
          <div class="sidebar-heading">
            <span class="eyebrow">能力航路账本</span>
            <span class="muted">只管理接入、配置与发布边界</span>
          </div>
          <nav aria-label="控制台主导航">
            <ul id="primary-nav" class="nav-list">
              <li><button class="nav-item is-active" type="button" data-view="overview" aria-current="page"><span class="nav-icon" aria-hidden="true"></span><span>总览</span></button></li>
              <li><button class="nav-item" type="button" data-view="modules"><span class="nav-icon" aria-hidden="true"></span><span>插件与能力</span><span class="sr-only">模块中心</span></button></li>
              <li><button class="nav-item" type="button" data-view="clients"><span class="nav-icon" aria-hidden="true"></span><span>Agent 接入</span></button></li>
              <li><button class="nav-item" type="button" data-view="adapters"><span class="nav-icon" aria-hidden="true"></span><span>适配器状态</span></button></li>
              <li><button class="nav-item" type="button" data-view="approvals"><span class="nav-icon" aria-hidden="true"></span><span>审批与发布</span></button></li>
              <li><button class="nav-item" type="button" data-view="audit"><span class="nav-icon" aria-hidden="true"></span><span>审计日志</span></button></li>
            </ul>
            <template id="legacy-read-only-views"><button type="button" data-view="tools">工具权限</button><button type="button" data-view="architecture">系统结构</button></template>
          </nav>
          <div class="sidebar-note">
            <span class="icon-wrap" aria-hidden="true"></span>
            <p>报价、关税和装柜数据仍在原系统。本页只调整获准能力，并以服务端读回为准。</p>
          </div>
        </aside>

        <main id="main-content" class="main-content" tabindex="-1">
          <div id="live-region" class="sr-only" aria-live="polite"></div>
          <div id="content" aria-busy="true">
            <section class="loading-panel" aria-labelledby="loading-title">
              <div class="loading-spinner" aria-hidden="true"></div>
              <h1 id="loading-title">加载中</h1>
              <p>正在读取控制台快照，请稍候。</p>
            </section>
          </div>
        </main>
      </div>

      <footer class="app-footer">
        <span>运营范围：插件能力、受控配置、接入、审批边界和审计状态</span>
        <span id="footer-mode">未连接正式后台</span>
      </footer>
    </div>

    <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body">
      <div class="dialog-head">
        <div>
          <span class="eyebrow">本地预览</span>
          <h2 id="dialog-title">草稿差异</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭预览"><span class="close-icon" aria-hidden="true"></span></button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <div class="dialog-actions">
        <button class="button button-secondary" type="button" data-action="close-dialog">关闭</button>
      </div>
    </dialog>

    <dialog id="identity-dialog" class="identity-dialog" aria-labelledby="identity-dialog-title" aria-describedby="identity-dialog-description">
      <form id="identity-form" class="identity-form" novalidate>
        <div class="dialog-head">
          <div>
            <span class="eyebrow">控制面身份</span>
            <h2 id="identity-dialog-title">输入模块作用域身份</h2>
          </div>
          <button class="icon-button" type="button" data-control-action="close-identity" aria-label="关闭身份输入"><span class="close-icon" aria-hidden="true"></span></button>
        </div>
        <p id="identity-dialog-description">身份只用于当前页面内的同源控制面请求。提交后输入框立即清空，页面不保存、不回显凭证。</p>
        <div class="field"><label for="identity-token">Bearer 身份</label><input id="identity-token" name="identity-token" type="password" autocomplete="current-password" required /></div>
        <p id="identity-form-error" class="field-error" role="alert" hidden>请输入身份后继续。</p>
        <div class="dialog-actions"><button class="button button-secondary" type="button" data-control-action="close-identity">取消</button><button class="button button-primary" type="submit" data-control-action="submit-identity">绑定并读取</button></div>
      </form>
    </dialog>

    <noscript>
      <div class="noscript-warning">此控制台需要启用浏览器脚本功能才能读取快照。当前不会连接任何正式后台。</div>
    </noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>

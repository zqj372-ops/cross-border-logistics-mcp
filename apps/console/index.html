<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="FreightClaw 统一服务入口：整柜与拼箱海运询价、关税与商品归类、进口税费估算，以及 CLI、API 和 MCP 接入。">
  <title>FreightClaw · 海运询价、关税与物流工具</title>
  <link rel="icon" type="image/svg+xml" href="/console/brand-icon.svg">
  <link rel="stylesheet" href="/console/styles.css">
  <script type="module" src="/console/app.js"></script>
</head>
<body>
  <!-- THESIS: FreightClaw makes an ocean inquiry or customs lookup an immediate choice.
  OWN-WORLD: User-pinned JoyAgent reference, https://joyagent.jd.com/pl/ (2026-09-07).
  White space, near-black typography and actions, quiet blue dot field, curved icon ribbon,
  pale service previews, and a dark footer. Keep FreightClaw branding and actual services.
  STORY: Choose a task, understand its inputs, then connect recurring work with CLI/API.
  FIRST VIEWPORT: Quiet horizontal navigation, centered two-weight headline, two direct
  actions, a logistics icon ribbon and four service previews; account lives in its icon.
  FORM: Code-led, responsive portal. Public customs retains 20 queries/day; tail quoting
  and personal records retain authentication. Source availability remains authoritative.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
  review, the verdict, DESIGN.md, and every shipping raster carrying its provenance. -->
  <noscript><p>此工作台需要启用 JavaScript。原有海运询价可从 <a href="/inquiry/">海运询价入口</a> 打开；CLI 安装包可从 <a href="/downloads/freightclaw-cli-0.1.0.tgz">这里下载</a>。</p></noscript>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="主要导航"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <div id="environment-note"></div>
      <main id="content" tabindex="-1" aria-busy="true">
        <div class="initial-state"><span class="wordmark">FreightClaw</span><h1>正在打开 FreightClaw</h1><p>海运询价、关税查询与物流工具。</p></div>
      </main>
    </div>
  </div>
  <div id="notification" class="notification" role="status" hidden></div>
  <p id="live-region" class="sr-only" aria-live="polite"></p>
  <dialog id="secret-dialog" aria-labelledby="secret-heading">
    <div class="dialog-head"><h2 id="secret-heading">保存 API Key</h2><button type="button" class="button quiet" data-action="close-secret" aria-label="关闭凭证窗口">关闭</button></div>
    <p>完整 Key 仅显示一次。复制并保存后，点击下方按钮即可自动验证，无需切换页面。</p>
    <code id="secret-value" class="secret-value"></code>
    <div id="secret-error" role="alert"></div>
    <div class="dialog-actions"><button type="button" class="button" data-action="copy-secret">复制 Key</button><button type="button" class="button primary" data-action="ack-secret">已保存，完成</button></div>
  </dialog>
</body>
</html>

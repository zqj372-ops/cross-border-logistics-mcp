<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">报价只算一份基础海运费</title><desc id="desc">选海运费 → 套其他费用 → 调整本票 → 发布报价。。海运费与模板不设有效期  ·  正式报价保留有效期  ·  缺价格时补充，不按零元计算</desc>
<rect width="1120" height="350" rx="20" fill="#f5f7fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<text x="48" y="57" fill="#172238" font-size="28" font-weight="700">报价只算一份基础海运费</text>
<text x="48" y="88" fill="#5c687e" font-size="16">选海运费 → 套其他费用 → 调整本票 → 发布报价。</text>
<rect x="48.0" y="122" width="328.0" height="138" rx="12" fill="white" stroke="#dbe2ee"/>
<text x="68.0" y="154" fill="#2459da" font-size="13" font-weight="700">01</text>
<text x="68.0" y="184" fill="#172238" font-size="22" font-weight="600">海运费表</text>
<text x="68.0" y="214" fill="#5c687e" font-size="15">航线 / 船公司 / 柜型</text>
<text x="68.0" y="237" fill="#5c687e" font-size="15">基础海运费的唯一来源</text>
<rect x="396.0" y="122" width="328.0" height="138" rx="12" fill="white" stroke="#dbe2ee"/>
<text x="416.0" y="154" fill="#2459da" font-size="13" font-weight="700">02</text>
<text x="416.0" y="184" fill="#172238" font-size="22" font-weight="600">其他费用模板</text>
<text x="416.0" y="214" fill="#5c687e" font-size="15">港杂 / 清关 / 拖车派送</text>
<text x="416.0" y="237" fill="#5c687e" font-size="15">复用常用费用组合</text>
<rect x="744.0" y="122" width="328.0" height="138" rx="12" fill="white" stroke="#dbe2ee"/>
<text x="764.0" y="154" fill="#2459da" font-size="13" font-weight="700">03</text>
<text x="764.0" y="184" fill="#172238" font-size="22" font-weight="600">本票报价</text>
<text x="764.0" y="214" fill="#5c687e" font-size="15">核对数量、售价和币种</text>
<text x="764.0" y="237" fill="#5c687e" font-size="15">保存版本，再确认发布</text>
<text x="48" y="307" fill="#5c687e" font-size="16">海运费与模板不设有效期  ·  正式报价保留有效期  ·  缺价格时补充，不按零元计算</text>
</g></svg>

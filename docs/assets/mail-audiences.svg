<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">同一票业务，三种通知对象</title><desc id="desc">保存前先确认：这条消息发给谁，哪些内容允许看。。配置收件邮箱 ≠ 授予后台权限  ·  SMTP 接收 ≠ 对方已收到  ·  发送结果不明先核对</desc>
<rect width="1120" height="350" rx="20" fill="#f5f7fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<text x="48" y="57" fill="#172238" font-size="28" font-weight="700">同一票业务，三种通知对象</text>
<text x="48" y="88" fill="#5c687e" font-size="16">保存前先确认：这条消息发给谁，哪些内容允许看。</text>
<rect x="48.0" y="122" width="328.0" height="138" rx="12" fill="white" stroke="#dbe2ee"/>
<text x="68.0" y="154" fill="#2459da" font-size="13" font-weight="700">01</text>
<text x="68.0" y="184" fill="#172238" font-size="22" font-weight="600">客户</text>
<text x="68.0" y="214" fill="#5c687e" font-size="15">报价、下单及公开进度</text>
<text x="68.0" y="237" fill="#5c687e" font-size="15">内部记录不对客户发送</text>
<rect x="396.0" y="122" width="328.0" height="138" rx="12" fill="white" stroke="#dbe2ee"/>
<text x="416.0" y="154" fill="#2459da" font-size="13" font-weight="700">02</text>
<text x="416.0" y="184" fill="#172238" font-size="22" font-weight="600">内部人员</text>
<text x="416.0" y="214" fill="#5c687e" font-size="15">节点负责人、协作与财务</text>
<text x="416.0" y="237" fill="#5c687e" font-size="15">按个人权限处理业务</text>
<rect x="744.0" y="122" width="328.0" height="138" rx="12" fill="white" stroke="#dbe2ee"/>
<text x="764.0" y="154" fill="#2459da" font-size="13" font-weight="700">03</text>
<text x="764.0" y="184" fill="#172238" font-size="22" font-weight="600">业务对接人</text>
<text x="764.0" y="214" fill="#5c687e" font-size="15">所负责节点的必要资料</text>
<text x="764.0" y="237" fill="#5c687e" font-size="15">不包含成本和内部备注</text>
<text x="48" y="307" fill="#5c687e" font-size="16">配置收件邮箱 ≠ 授予后台权限  ·  SMTP 接收 ≠ 对方已收到  ·  发送结果不明先核对</text>
</g></svg>

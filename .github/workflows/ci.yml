name: 持续验证

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: 编译、测试与镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 编译
        run: npm run build
      - name: 全量测试
        run: npm test -- --run
      - name: 类型检查
        run: npm run typecheck
      - name: 代码规范
        run: npm run lint
      - name: 契约校验
        run: npm run validate:schemas
      - name: 演示发布门禁
        run: bash deploy/scripts/check-release.sh --fixture-only
      - name: 容器配置校验
        run: docker compose --env-file deploy/env.example -f deploy/compose.yml config
      - name: 构建候选镜像
        run: docker build -f deploy/Dockerfile .
